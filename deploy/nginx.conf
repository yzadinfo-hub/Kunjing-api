# Zumeng API — Nginx 反代配置（备选，未使用 Caddy 时）
#
# 关键点：
#   1. /v1/* 必须关闭缓冲（proxy_buffering off）并放宽超时，否则 SSE 流式会卡住
#   2. 大请求体（图片/音频/长上下文）需调大 client_max_body_size
#   3. 需另配 certbot 或手动证书；此处 TLS 证书路径为示例

upstream zumeng_api {
    server zumeng-api:3000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/tls/api.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api.example.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 长上下文 + 图片/音频上传
    client_max_body_size 64m;
    client_body_timeout 300s;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 流式（SSE）与普通请求分流
    location /v1/ {
        proxy_pass http://zumeng_api;
        proxy_http_version 1.1;

        # —— SSE 关键：禁用缓冲 ——
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # —— 放宽超时（与 STREAMING_TIMEOUT 对齐）——
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://zumeng_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/zumeng-api.access.log;
    error_log  /var/log/nginx/zumeng-api.error.log;
}
